    container_name: nodemanager
    hostname: nodemanager
    restart: always
    environment:
      - SERVICE_PRECONDITION=namenode:9000 resourcemanager:8088
    env_file:
      - ./docker/hadoop.env
    ports:
      - "8042:8042"
    networks:
      - hadoop_net

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
