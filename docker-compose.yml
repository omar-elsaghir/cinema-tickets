version: '3.8'

services:
  # ==========================================
  # MASTER NODE (HDFS Namenode / Spark Master)
  # ==========================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: ticket-master-node
    hostname: namenode
    restart: always
    ports:
      - "9870:9870"  # HDFS Namenode Web UI
      - "9000:9000"  # HDFS RPC Port
    environment:
      - CLUSTER_NAME=ticket-reservation-cluster
      - HDFS_CONF_dfs_replication=3
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./config/hdfs-site.xml:/etc/hadoop/hdfs-site.xml
      - ./config/core-site.xml:/etc/hadoop/core-site.xml
    networks:
      - ticket-cluster-net

  # ==========================================
  # 10 WORKER NODES (HDFS Datanodes 1..10)
  # ==========================================
  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: ticket-worker-node-1
    hostname: datanode-1
    restart: always
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hadoop_datanode_1:/hadoop/dfs/data
    networks:
      - ticket-cluster-net
    depends_on:
      - namenode

  datanode-2:
